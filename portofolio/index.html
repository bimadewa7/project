<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bima Arya Dewa</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23141416' stroke='%232E2E30' stroke-width='4'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='%23F2F2F0' font-family='sans-serif' font-size='46' font-weight='bold' letter-spacing='-1.5'>Dv</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&display=swap" rel="stylesheet" />
  <style>
    .no-transition * { transition: none !important; }
    body {
      font-family: 'Inter Tight', sans-serif;
    }

    .lang-text {
      opacity: 0;
      /* DURATION: Durasi per kata muncul (makin kecil makin cepat) */
      animation: sequence 0.14s linear forwards;
    }

    .transition-page {
      /* TRANSITION: Kecepatan efek blur/scale keluar */
      transition: opacity 0.25s ease, transform 0.25s ease, filter 0.25s ease;
    }

    .is-transitioning {
      opacity: 0;
      transform: scale(0.95);
      filter: blur(10px);
    }

    @keyframes sequence {
      0% {
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      80% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    /* DELAY: Jarak interval antar bahasa (makin kecil makin cepat berganti) */
    .lang-text:nth-child(1) {
      animation-delay: 0.00s;
    }

    .lang-text:nth-child(2) {
      animation-delay: 0.08s;
    }

    .lang-text:nth-child(3) {
      animation-delay: 0.16s;
    }

    .lang-text:nth-child(4) {
      animation-delay: 0.24s;
    }

    .lang-text:nth-child(5) {
      animation-delay: 0.32s;
    }

    .lang-text:nth-child(6) {
      animation-delay: 0.40s;
    }

    .lang-text:nth-child(7) {
      animation-delay: 0.48s;
    }

    .lang-text:nth-child(8) {
      animation-delay: 0.56s;
    }

    .lang-text:nth-child(9) {
      animation-delay: 0.64s;
    }

    .lang-text:nth-child(10) {
      animation-delay: 0.72s;
    }

    .lang-text:nth-child(11) {
      animation-delay: 0.80s;
    }
  </style>
</head>

<body class="bg-[#0B0B0C] flex items-center justify-center h-screen overflow-hidden transition-page"
  onload="startTransition()">
  <div class="relative text-center font-bold text-4xl text-[#F2F2F0] tracking-widest uppercase">
    <span class="lang-text absolute left-1/2 -translate-x-1/2 whitespace-nowrap">Hello World</span>
    <span class="lang-text absolute left-1/2 -translate-x-1/2 whitespace-nowrap">Привет, мир</span>
    <span class="lang-text absolute left-1/2 -translate-x-1/2 whitespace-nowrap">你好，世界</span>
    <span class="lang-text absolute left-1/2 -translate-x-1/2 whitespace-nowrap">こんにちは世界</span>
    <span class="lang-text absolute left-1/2 -translate-x-1/2 whitespace-nowrap">안녕하세요 세계</span>
    <span class="lang-text absolute left-1/2 -translate-x-1/2 whitespace-nowrap">Halo Dunia</span>
    <span class="lang-text absolute left-1/2 -translate-x-1/2 whitespace-nowrap">Hola Mundo</span>
    <span class="lang-text absolute left-1/2 -translate-x-1/2 whitespace-nowrap">Bonjour le monde</span>
    <span class="lang-text absolute left-1/2 -translate-x-1/2 whitespace-nowrap">Hallo Welt</span>
    <span class="lang-text absolute left-1/2 -translate-x-1/2 whitespace-nowrap">Ciao mondo</span>
    <span class="lang-text absolute left-1/2 -translate-x-1/2 whitespace-nowrap">Olá Mundo</span>
  </div>
  <script>
    function startTransition() {
      // TOTAL_ANIMATION: 0.8s (last delay) + 0.14s (duration) = ~0.94s
      setTimeout(() => {
        document.body.classList.add('is-transitioning');
        // TRANSITION_WAIT: Waktu tunggu sebelum pindah page
        setTimeout(() => {
          window.location.href = 'bio.html';
        }, 200);
      }, 750);
    }
  </script>
</body>

</html>
