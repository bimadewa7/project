<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bima Arya Dewa</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23141416' stroke='%232E2E30' stroke-width='4'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='%23F2F2F0' font-family='sans-serif' font-size='46' font-weight='bold' letter-spacing='-1.5'>Dv</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .no-transition * { transition: none !important; }
    body {
      font-family: 'Space Grotesk', sans-serif;
    }

    .lang-text {
      opacity: 0;
      animation: sequence 0.16s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      letter-spacing: 0.25em;
    }

    .transition-page {
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .is-transitioning {
      opacity: 0;
      transform: scale(0.96);
      filter: blur(12px);
    }

    @keyframes sequence {
      0% {
        opacity: 0;
        transform: translate(-50%, 6px);
      }
      25% {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      75% {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -6px);
      }
    }

    .lang-text:nth-child(1) { animation-delay: 0.00s; }
    .lang-text:nth-child(2) { animation-delay: 0.09s; }
    .lang-text:nth-child(3) { animation-delay: 0.18s; }
    .lang-text:nth-child(4) { animation-delay: 0.27s; }
    .lang-text:nth-child(5) { animation-delay: 0.36s; }
    .lang-text:nth-child(6) { animation-delay: 0.45s; }
    .lang-text:nth-child(7) { animation-delay: 0.54s; }
    .lang-text:nth-child(8) { animation-delay: 0.63s; }
    .lang-text:nth-child(9) { animation-delay: 0.72s; }
    .lang-text:nth-child(10) { animation-delay: 0.81s; }
    .lang-text:nth-child(11) { animation-delay: 0.90s; }

    /* Center breathing ambient spotlight */
    .center-spotlight {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(160, 147, 138, 0.12) 0%, rgba(11, 11, 12, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: pulseSpotlight 4s ease-in-out infinite alternate;
    }

    @keyframes pulseSpotlight {
      0% { transform: scale(0.85); opacity: 0.08; }
      100% { transform: scale(1.15); opacity: 0.18; }
    }
  </style>
</head>

<body class="bg-[#0B0B0C] flex items-center justify-center h-screen overflow-hidden transition-page relative select-none"
  onload="startTransition()">
  <!-- Atmospheric background glow -->
  <div class="center-spotlight"></div>
  <div class="fog-orb fog-orb-1"></div>

  <!-- Multilingual Splash Text -->
  <div class="relative text-center font-bold text-3xl sm:text-4xl text-[#F2F2F0] tracking-widest uppercase z-10">
    <span class="lang-text absolute left-1/2 whitespace-nowrap">Hello World</span>
    <span class="lang-text absolute left-1/2 whitespace-nowrap">Привет, мир</span>
    <span class="lang-text absolute left-1/2 whitespace-nowrap">你好，世界</span>
    <span class="lang-text absolute left-1/2 whitespace-nowrap">こんにちは世界</span>
    <span class="lang-text absolute left-1/2 whitespace-nowrap">안녕하세요 세계</span>
    <span class="lang-text absolute left-1/2 whitespace-nowrap">Halo Dunia</span>
    <span class="lang-text absolute left-1/2 whitespace-nowrap">Hola Mundo</span>
    <span class="lang-text absolute left-1/2 whitespace-nowrap">Bonjour le monde</span>
    <span class="lang-text absolute left-1/2 whitespace-nowrap">Hallo Welt</span>
    <span class="lang-text absolute left-1/2 whitespace-nowrap">Ciao mondo</span>
    <span class="lang-text absolute left-1/2 whitespace-nowrap">Olá Mundo</span>
  </div>

  <script>
    function startTransition() {
      // 0.90s (last delay) + 0.16s (duration) = ~1.06s
      setTimeout(() => {
        document.body.classList.add('is-transitioning');
        setTimeout(() => {
          window.location.href = 'bio.html';
        }, 400);
      }, 950);
    }
  </script>
</body>

</html>
